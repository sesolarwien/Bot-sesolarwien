<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>PHONETASTIC – Kopie-Blatt A4 quer</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Poppins', system-ui, sans-serif; background: #b9bec4; }

  /* A4 quer bei 150 dpi, wird mit Faktor 2 gerendert → 300 dpi.
     Nur Schwarz auf Weiß: bleibt auf jedem Kopierer scharf. */
  .blatt {
    width: 1754px; height: 1240px; background: #ffffff;
    padding: 76px 90px 70px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; text-align: center;
  }
  .blatt > * { flex: none; }

  .kopie {
    font-size: 330px; font-weight: 900; letter-spacing: .22em;
    text-transform: uppercase; color: #000; line-height: 1;
    padding-left: .22em;           /* die Sperrung schiebt nach rechts */
  }

  .mail {
    font-size: 120px; font-weight: 800; color: #000;
    letter-spacing: -.005em; white-space: nowrap; line-height: 1.1;
  }

  .qr { width: 360px; height: 360px; }
  .qr img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

<div class="blatt" id="blatt">

  <div class="kopie">Kopie</div>

  <div class="mail">info@phonetastic.at</div>

  <div class="qr"><img src="qr-mail.svg" alt="QR-Code: E-Mail an info@phonetastic.at" /></div>

</div>

</body>
</html>
