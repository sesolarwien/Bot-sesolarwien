<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>PHONETASTIC – Favicon</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Poppins', system-ui, sans-serif; background: transparent; }

  /* Bei 16 px bleibt von einem Bild fast nichts übrig. Darum eine
     vollflächige Kachel im Verlauf mit einem weißen P – maximaler
     Kontrast, keine dünnen Linien. */
  .icon {
    width: 512px; height: 512px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #22c55e 0%, #22d3ee 55%, #38bdf8 100%);
    border-radius: 96px;
  }
  .icon span {
    font-size: 372px; font-weight: 900; color: #ffffff; line-height: 1;
    /* Das P sitzt in seinem Schriftkasten nicht mittig – gemessene Korrektur */
    transform: translate(-.0236em, .055em);
  }
</style>
</head>
<body>
  <div class="icon" id="icon"><span>P</span></div>
</body>
</html>
