<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>PHONETASTIC – Logo quer mit Leistungen</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
  :root {
    --grad: linear-gradient(100deg, #22c55e 0%, #34d399 30%, #22d3ee 60%, #38bdf8 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Poppins', system-ui, sans-serif; background: #555; }

  /* Querformat für Schild, Website-Kopf und Briefpapier.
     Hier ist Platz genug, dass die Leistungen wirklich lesbar sind. */
  .quer {
    width: 2400px; height: 760px;
    display: flex; align-items: center; justify-content: center; gap: 74px;
    padding: 0 108px 0 72px;
  }
  .quer--dark {
    background:
      radial-gradient(900px 700px at 18% 10%, rgba(52, 211, 153, .20), transparent 64%),
      radial-gradient(900px 700px at 88% 92%, rgba(56, 189, 248, .22), transparent 64%),
      linear-gradient(150deg, #0b1220 0%, #16233a 55%, #0a1526 100%);
  }
  .quer--light { background: #ffffff; }

  .zeichen { width: 268px; height: 268px; flex: none; display: block; }

  .text { display: flex; flex-direction: column; }
  .top {
    font-size: 34px; font-weight: 700; letter-spacing: .44em;
    text-transform: uppercase; margin-bottom: 14px;
  }
  .quer--dark .top { color: #9fb3c8; }
  .quer--light .top { color: #79818d; }

  .wort {
    font-size: 178px; font-weight: 900; text-transform: uppercase;
    line-height: .94; letter-spacing: .012em;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .quer--dark .wort { filter: drop-shadow(0 0 34px rgba(52, 211, 153, .32)); }

  .leistungen {
    margin-top: 20px; padding-top: 20px;
    font-size: 40px; font-weight: 600; letter-spacing: .13em;
    text-transform: uppercase;
  }
  .quer--dark .leistungen { color: #dbe6f0; border-top: 2px solid rgba(148, 163, 184, .3); }
  .quer--light .leistungen { color: #14161a; border-top: 2px solid #e4e7ec; }
  .leistungen i { font-style: normal; margin: 0 .5em; }
  .quer--dark .leistungen i { color: #34d399; }
  .quer--light .leistungen i { color: #0f9d63; }
</style>
</head>
<body>

<div class="quer quer--dark" id="quer-dunkel">
  <svg class="zeichen" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gd" x1="30" y1="20" x2="170" y2="180" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#22c55e" /><stop offset=".32" stop-color="#34d399" />
        <stop offset=".66" stop-color="#22d3ee" /><stop offset="1" stop-color="#38bdf8" />
      </linearGradient>
    </defs>
    <rect x="52" y="10" width="96" height="180" rx="22" fill="url(#gd)" />
    <text x="100" y="141" text-anchor="middle" fill="#0b1220"
          font-family="Poppins" font-weight="900" font-size="124">P</text>
  </svg>
  <div class="text">
    <span class="top">Handy Reparatur</span>
    <span class="wort">Phonetastic</span>
    <span class="leistungen">Reparatur<i>·</i>Zubehör<i>·</i>An- &amp; Verkauf<i>·</i>SIM-Karten</span>
  </div>
</div>

<div class="quer quer--light" id="quer-hell">
  <svg class="zeichen" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gh" x1="30" y1="20" x2="170" y2="180" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#22c55e" /><stop offset=".32" stop-color="#34d399" />
        <stop offset=".66" stop-color="#22d3ee" /><stop offset="1" stop-color="#38bdf8" />
      </linearGradient>
    </defs>
    <rect x="52" y="10" width="96" height="180" rx="22" fill="url(#gh)" />
    <text x="100" y="141" text-anchor="middle" fill="#ffffff"
          font-family="Poppins" font-weight="900" font-size="124">P</text>
  </svg>
  <div class="text">
    <span class="top">Handy Reparatur</span>
    <span class="wort">Phonetastic</span>
    <span class="leistungen">Reparatur<i>·</i>Zubehör<i>·</i>An- &amp; Verkauf<i>·</i>SIM-Karten</span>
  </div>
</div>

</body>
</html>
